# I can go to different windows using C-a 1 2 3 4 
# see all the pasted in buffed C-a =




set -g default-terminal "screen-256color"
set -g history-limit 200000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500



# Unbind default key bindings, we're going to override
unbind "\$" # rename-session
unbind ,    # rename-window
unbind %    # split-window -h
unbind '"'  # split-window
# unbind }    # swap-pane -D
# unbind {    # swap-pane -U
unbind y
unbind r
# unbind "'"  # select-window
# unbind n    # next-window
# unbind p    # previous-window
# unbind l    # last-window
# unbind M-n  # next window with alert
# unbind M-p  # next window with alert

unbind C-w
bind C-w source-file ~/.config/tmux/tmux.conf  |; display "Sourced ~/.tmux.conf"
set -g prefix C-q


set -g mouse on
set -g default-shell ${SHELL} 
set -g default-command ${SHELL}

set-option -g status-position top



# Copy mode ----------------------------------------------------------

# prefix + [ --> enter tmux copy mode ;
# THIS IS SOOO COOL => you can look into tmux paste buffer using `prefix + =`
# remember to install `xclip` for some reason it integerated everything nicely

# Use Vim-style keybindings in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"




# ------------- Window, Panes configurations  ----------------------------

# [Temporarily hide all the panes in a window]
# this is a really nice keybinding
# Press prefix+z => hat particular pane would be your only view until you press the keybinding again

# prefix + v TOGGLES the visibility of status bar on TMUX
bind v set-option -g status

# Start windows and panes at 1.
set -g base-index 1
set -g pane-base-index 1

# Prompt to rename window right after it's created
# set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'

# Rename session and window



# these 2 rename commands are interferring with tmux-resurrect RELOAD the session
bind-key r command-prompt -I "#{window_name}" "rename-window '%%'"
bind-key R command-prompt -I "#{session_name}" "rename-session '%%'"


bind s choose-tree -sZ -O time # Sort by 'name' , 'time'(activity/most recent) when using leader + s

bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Meta + h/l to cycle through tabs.
bind-key -n M-h previous-window
bind-key -n M-l next-window

bind-key ^space last-window

bind L split-window -h -c "#{pane_current_path}"
bind J split-window -v -c "#{pane_current_path}"

# Ctrl+A h/l to swap windows left/right, i.e. moving the tabs around.
bind-key M-h swap-window -t -1\; select-window -t -1
bind-key M-l swap-window -t +1\; select-window -t +1

# You can press prefix one and then repeat C+hjkl how much ever time you want 
# => -r is awesome 
# Ctr + h/j/k/l to resize panes.
bind-key -r -T prefix  C-k  resize-pane -U 2
bind-key -r -T prefix  C-j  resize-pane -D 2
bind-key -r -T prefix  C-h  resize-pane -L 2
bind-key -r -T prefix  C-l  resize-pane -R 2

# Zoom pane ;
bind + resize-pane -Z


# ----------------------------------------------------------------------------------------

## Status bar design --------> this was really good

# set -g status-utf8 on
set -g status-justify left
set -g status-bg default
set -g status-interval 2


# Customise the visuals on top of One Dark for tmux. Might be good to put into
# its own file at some stage.
onedark_black="#282C34"
dark_black="#1c1c1c"
white="#ffffff"

set -g pane-border-style "fg=color238 bg=#282C34" # i.e. "$onedark_black"
set -g pane-active-border-style "fg=color14 bg=#282C34" # i.e. "$onedark_black"

# Info on left (I don't have a session display for now)
set -g status-left ''

set -g status-position top
set -g status-style "bg=black"
set -g status-left '#[fg=color14,bold]#S '
# set -g status-right '  #[fg=color250] %Y-%m-%d #[fg=white,bold]%H:%M:%S' # shows time but that is already shown in zsh
set -g status-right '  #[fg=color250] %Y-%m-%d'

set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-format '#I#[fg=colour245,bg=black]:#W#[fg=colour50,bg=black]#F '

# Set the style for the _current_ window.
setw -g window-status-current-format '#[fg=color250,bg=black]#I#[fg=color245]:#[fg=color255,bold]#W#[fg=colour50]#F '

# ----------------------------------------------------------------------------------------



# List of plugins
# tpm was itself buggy, apparently some weird error related to make version
run-shell /home/nira/.config/tmux/plugins/tmux-resurrect/resurrect.tmux